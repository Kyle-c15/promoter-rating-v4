<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0878dd">
<title>Service Rating · Portrait Prototype</title>
<style>
:root{--brand:#0878dd;--brand-strong:#055cae;--brand-soft:#eef7ff;--ink:#10182b;--muted:#66758b;--line:#d7e8f8;--canvas:#f5f9fd;--surface:#fff;--warning:#9a6512;--warning-soft:#fff3dc;--success:#0878dd;--success-soft:#eaf4ff;--danger:#b43d41;--danger-soft:#fff0f0;--focus:#0878dd;--shadow:0 8px 22px rgba(21,46,76,.08)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:"HarmonyOS Sans SC",MiSans,"PingFang SC","Segoe UI","Microsoft YaHei",Arial,sans-serif;background:var(--canvas);color:var(--ink);font-size:15px}
body{overflow:hidden}
button,textarea{font:inherit}
button{cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
#app{width:100%;height:100dvh}
.shell{width:100%;max-width:480px;height:100%;margin:0 auto;background:var(--canvas);display:flex;flex-direction:column;overflow:hidden}
.topbar{height:calc(82px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 16px 0;flex:0 0 auto;background:linear-gradient(180deg,#0751ab 0%,#0b91e4 100%);display:grid;grid-template-columns:64px minmax(0,1fr) 44px;align-items:center;border-bottom:1px solid rgba(255,255,255,.3);box-shadow:inset 0 -1px rgba(255,255,255,.18)}
.iconButton{width:40px;height:40px;border:0;border-radius:8px;background:transparent;color:#fff;font-size:29px;line-height:1;display:grid;place-items:center;transition:background .15s ease,color .15s ease}
.iconButton:hover{background:rgba(255,255,255,.16);color:#fff}
.brandMark{width:56px;height:56px;display:block;object-fit:cover;border:2px solid rgba(255,255,255,.88);border-radius:14px;background:#fff;box-shadow:0 4px 12px rgba(4,73,138,.24)}
.appName{min-width:0;margin-left:2px;padding-left:18px;border-left:2px solid rgba(255,255,255,.72);text-align:left}
.appTitle{font-size:21px;font-weight:950;line-height:1.2;color:#fff}
.scrollArea{min-height:0;flex:1;overflow-y:auto;overscroll-behavior:contain;background:var(--canvas)}
.page{padding:22px 16px 24px;min-height:100%}
.intro{padding:0 2px 4px}
.eyebrow{font-size:12px;font-weight:850;color:var(--brand-strong);line-height:1.3}
h1{font-size:30px;font-weight:950;line-height:1.18;margin:6px 0 7px}
.introTitleRow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 7px}
.introTitleRow h1{min-width:0;margin:0}
.languagePicker{display:inline-flex;flex:0 0 auto;gap:2px;padding:3px;border:1px solid #c7ddee;border-radius:8px;background:#eaf1f8}
.languageButton{min-width:34px;height:30px;border:0;border-radius:5px;padding:0 7px;background:transparent;color:#5a6d86;font-size:12px;font-weight:950;line-height:1}
.languageButton.active{background:var(--surface);color:var(--brand-strong);box-shadow:0 1px 4px rgba(21,46,76,.12)}
.subtext{font-size:15px;line-height:1.5;color:var(--muted);margin:0}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:20px;padding:4px;border-radius:10px;background:#eaf1f8}
.tab{min-height:46px;border:0;border-radius:7px;background:transparent;color:var(--muted);font-size:18px;font-weight:850;transition:background .15s ease,color .15s ease}
.tab.active{background:var(--surface);color:var(--brand-strong);box-shadow:0 1px 5px rgba(21,46,76,.11)}
.listHead{display:flex;justify-content:space-between;align-items:center;padding:22px 2px 10px;gap:12px}
.listHead strong{font-size:19px;font-weight:950}
.listHead span{font-size:13px;color:var(--muted);white-space:nowrap}
.taskList{display:grid;gap:11px}
.task{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:16px;min-height:172px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.taskTop{display:flex;align-items:center;gap:11px;min-width:0}
.avatar{width:44px;height:44px;border-radius:50%;background:#eaf4ff;border:1px solid #cfe5f8;display:grid;place-items:center;font-size:22px;flex:0 0 auto}
.taskMeta{min-width:0;flex:1}
.taskName{font-size:18px;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.taskDate{font-size:14px;color:var(--muted);margin-top:4px}
.status{font-size:14px;font-weight:850;border-radius:6px;padding:6px 9px;white-space:nowrap}
.status.pending{color:var(--warning);background:var(--warning-soft)}
.status.positive{color:var(--success);background:var(--success-soft)}
.status.negative{color:var(--danger);background:var(--danger-soft)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:14px;line-height:1.3;color:#41536d;background:#f0f6fc;border-radius:6px;padding:6px 9px}
.taskBottom{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto}
.taskBottom.actionOnly{justify-content:flex-end}
.due{font-size:14px;line-height:1.35;color:var(--warning)}
.due.done{color:var(--muted)}
.primary,.secondary{min-height:48px;border-radius:8px;padding:0 17px;font-size:16px;font-weight:950;white-space:nowrap;transition:background .15s ease,border-color .15s ease,color .15s ease}
.primary{border:1px solid var(--brand);background:var(--brand);color:#fff;box-shadow:0 4px 10px rgba(8,120,221,.22)}
.primary:hover{border-color:var(--brand-strong);background:var(--brand-strong)}
.secondary{border:1px solid #cfe2f5;background:var(--surface);color:#354b69}
.secondary:hover{border-color:#a3c6e7;background:var(--brand-soft);color:var(--brand-strong)}
.empty{min-height:210px;display:grid;place-items:center;text-align:center;border:1px dashed #bfd4e9;border-radius:10px;background:#fbfdff;color:var(--muted);padding:24px}
.emptyContent{display:grid;justify-items:center;gap:7px}
.emptyIcon{width:48px;height:48px;display:grid;place-items:center;border-radius:50%;background:#e7f3ff;color:var(--brand-strong);font-size:26px;font-weight:950;line-height:1}
.empty strong{color:var(--ink);font-size:16px;font-weight:950}
.empty span{max-width:250px;font-size:13px;line-height:1.5}
.policy{font-size:14px;line-height:1.55;color:var(--muted);padding:20px 2px 4px}
.detailPage{padding:18px 16px 12px}
.agentBlock{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:0 0 16px}
.agentName{font-size:17px;font-weight:950}
.agentDetail{font-size:13px;color:var(--muted);line-height:1.5;margin-top:3px}
.formIntro{padding:21px 0 14px}
.formIntro h1{font-size:26px;margin:0 0 7px}
.anonymousControl{width:100%;display:flex;align-items:center;gap:11px;margin:0 0 18px;padding:12px;border:1px solid #b9d9f4;border-radius:9px;background:#f2f8fe;color:#38597d;text-align:left;transition:border-color .15s ease,background .15s ease}
.anonymousControl:hover{border-color:#84bce8;background:#eaf5ff}
.anonymousCopy{display:grid;gap:2px;min-width:0;flex:1}
.anonymousCopy strong{color:var(--brand-strong);font-size:14px;font-weight:950}
.anonymousCopy span{font-size:12px;line-height:1.4}
.anonymousSwitch{width:40px;height:24px;flex:0 0 auto;border-radius:12px;background:#a9bacb;position:relative;transition:background .15s ease}
.anonymousSwitch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(21,46,76,.22);transition:transform .15s ease}
.anonymousSwitch.on{background:var(--brand)}
.anonymousSwitch.on::after{transform:translateX(16px)}
.sentiments{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0 0 18px}
.sentiment{min-height:100px;border:2px solid var(--line);border-radius:10px;background:var(--surface);padding:11px 7px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--ink);transition:border-color .15s ease,background .15s ease,transform .15s ease}
.sentiment:hover{transform:translateY(-1px)}
.sentiment .face{width:48px;height:48px;display:grid;place-items:center;flex:0 0 auto}
.sentiment .face img{width:100%;height:100%;display:block;object-fit:fill}
.sentiment strong{font-size:15px;font-weight:950}
.sentiment.selected.negative{border-color:var(--danger);background:#fff8f8}
.sentiment.selected.positive{border-color:var(--success);background:#f6fbff}
.section{border-top:1px solid var(--line);padding:18px 0}
.sectionTitle{font-size:15px;font-weight:950;margin:0 0 5px}
.sectionHelp{font-size:13px;color:var(--muted);line-height:1.5;margin:0 0 11px}
.serviceRow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:11px}
.serviceIcon{width:30px;height:30px;display:grid;place-items:center;flex:0 0 auto}
.serviceAsset{width:30px;height:30px;display:block;object-fit:contain}
.serviceCopy{min-width:0;flex:1}
.serviceTitle{font-size:13px;font-weight:850}
.serviceTime{font-size:12px;color:var(--muted);margin-top:3px}
.serviceAmount{font-size:13px;font-weight:950;white-space:nowrap}
.tagGroups{display:grid;gap:16px}
.tagGroup{display:grid;gap:8px}
.tagGroupTitle{font-size:14px;font-weight:950;color:var(--ink)}
.tagGrid{display:flex;gap:8px;flex-wrap:wrap}
.tag{min-height:38px;border:1px solid #d3e4f5;border-radius:19px;padding:0 13px;background:var(--surface);font-size:13px;color:#445b77;transition:border-color .15s ease,background .15s ease,color .15s ease}
.tag:hover{border-color:#a8c9e8;background:#f4f9ff}
.tag.selected{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-strong);font-weight:850}
.textarea{width:100%;min-height:104px;resize:vertical;border:1px solid #d3e4f5;border-radius:9px;padding:12px;font-size:14px;line-height:1.55;color:var(--ink);background:var(--surface)}
.textarea::placeholder{color:#90a2b8}
.counter{text-align:right;font-size:12px;color:var(--muted);margin-top:5px}
.footerActions{flex:0 0 auto;padding:11px 16px calc(11px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -5px 18px rgba(21,46,76,.05)}
.footerActionButtons{display:grid;grid-template-columns:1fr 1.25fr;gap:9px}
.footerActions .primary,.footerActions .secondary{width:100%}
.footerActions .primary:disabled{cursor:not-allowed;opacity:.46;box-shadow:none}
.anonymousFooter{margin:0 0 9px;text-align:center;color:#526a88;font-size:12px;line-height:1.4}
.reviewSummary{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:16px;box-shadow:var(--shadow)}
.reviewResult{display:flex;align-items:center;gap:12px}
.reviewFace{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;overflow:hidden;font-size:0}
.reviewFace img{width:100%;height:100%;display:block;object-fit:fill}
.reviewResult strong{font-size:18px;font-weight:950}
.reviewResult span{display:block;font-size:13px;line-height:1.45;color:var(--muted);margin-top:3px}
.anonymousReview{color:var(--brand-strong);font-size:12px;font-weight:850}
.reviewBlock{border-top:1px solid var(--line);padding:18px 0}
.reviewBlock strong{font-size:15px;font-weight:950}
.commentBox{min-width:0;max-width:100%;margin-top:9px;padding:12px;border-radius:8px;background:#f2f7fc;font-size:14px;line-height:1.55;color:#405775;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}
.toast{position:fixed;z-index:20;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:calc(100vw - 32px);padding:11px 14px;border-radius:8px;background:#10182b;color:#fff;font-size:14px;font-weight:850;box-shadow:0 7px 18px rgba(16,38,43,.24);display:none}
@media (min-width:481px){body{display:flex;align-items:center;justify-content:center;background:#e6eef7}.shell{height:min(900px,100dvh);border:1px solid #d4e4f4;border-radius:14px;box-shadow:0 18px 48px rgba(21,46,76,.14)}}
@media (max-width:340px){.page,.detailPage{padding-left:12px;padding-right:12px}.introTitleRow h1{font-size:27px}.task{padding:13px}.sentiments{gap:8px}.sentiment{min-height:100px}.footerActions{padding-left:12px;padding-right:12px}.primary,.secondary{padding:0 12px}}
</style>
</head>
<body>

<div class="toast" id="toast" role="status"></div>

let view="pending";

    "You can rate completed agent services within 7 days of completion.":"Maaari mong i-rate ang nakumpletong serbisyo ng ahente sa loob ng 7 araw matapos itong makumpleto.",

function escapeHtml(value){return String(value||"").replace(/[&<>"']/g,function(character){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[character]})}
function translateText(value){const dictionary=translations[language];if(!dictionary)return String(value);return Object.keys(dictionary).sort(function(left,right){return right.length-left.length}).reduce(function(output,source){return output.split(source).join(dictionary[source])},String(value))}
function activeTask(){return tasks.find(function(task){return task.id===activeId})||tasks[0]}
function toast(message){const element=document.getElementById("toast");element.textContent=translateText(message);element.style.display="block";clearTimeout(window.toastTimer);window.toastTimer=setTimeout(function(){element.style.display="none"},2200)}
function topbar(title,back){const left=back?'<button class="iconButton" aria-label="Back" onclick="goList()">‹</button>':'<img class="brandMark" src="tongits-go-logo.png" alt="Tongits Go">';return '<header class="topbar">'+left+'<div class="appName"><div class="appTitle">'+title+'</div></div><button class="iconButton" aria-label="Close" onclick="closeH5()">×</button></header>'}
function languagePicker(){return '<div class="languagePicker" role="group" aria-label="Language"><button class="languageButton '+(language==="EN"?"active":"")+'" type="button" aria-pressed="'+(language==="EN")+'" onclick="setLanguage(\'EN\')">EN</button><button class="languageButton '+(language==="PH"?"active":"")+'" type="button" aria-pressed="'+(language==="PH")+'" onclick="setLanguage(\'PH\')">PH</button></div>'}
function services(task,showTime){return task.services.map(function(service){const asset=serviceAssets[service.asset]||serviceAssets.diamond;return '<div class="serviceRow"><div class="serviceIcon"><img class="serviceAsset" src="'+asset+'" alt=""></div><div class="serviceCopy"><div class="serviceTitle">'+escapeHtml(service.title)+'</div>'+(showTime?'<div class="serviceTime">'+escapeHtml(service.time)+'</div>':'')+'</div><div class="serviceAmount">'+escapeHtml(service.amount)+'</div></div>'}).join("")}
function taskCard(task){const pending=task.status==="pending";const sentiment=task.sentiment||"positive";const statusClass=pending?"pending":sentiment;const action=pending?'<button class="primary" onclick="openRating(\''+task.id+'\')">Rate now</button>':(task.detailStatus==="added"?'<button class="secondary" onclick="openReview(\''+task.id+'\')">View rating</button>':'<button class="secondary" onclick="openRating(\''+task.id+'\')">Add details</button>');const detailStatus=pending?"":'<span class="due done">'+escapeHtml(task.detailStatus==="added"?"Details added":"Details not added")+'</span>';return '<article class="task"><div class="taskTop"><div class="avatar">'+task.avatar+'</div><div class="taskMeta"><div class="taskName">'+escapeHtml(task.agent)+'</div><div class="taskDate">'+escapeHtml(task.date)+'</div></div><span class="status '+statusClass+'">'+(pending?"Pending":labels[sentiment])+'</span></div><div class="chips">'+task.services.map(function(service){return '<span class="chip">'+escapeHtml(service.title)+'</span>'}).join("")+'</div><div class="taskBottom '+(pending?"actionOnly":"")+'">'+detailStatus+action+'</div></article>'}
function emptyListState(reviewed){const state=reviewed?{icon:"★",title:"No ratings yet",description:"Ratings you submit will appear here."}:{icon:"✓",title:"All caught up",description:"You have no services waiting for a rating."};return '<div class="empty"><div class="emptyContent"><div class="emptyIcon" aria-hidden="true">'+state.icon+'</div><strong>'+state.title+'</strong><span>'+state.description+'</span></div></div>'}
function listPage(reviewed){const items=tasks.filter(function(task){return reviewed?task.status==="reviewed":task.status==="pending"});const pendingCount=tasks.filter(function(task){return task.status==="pending"}).length;const reviewedCount=tasks.filter(function(task){return task.status==="reviewed"}).length;const list=items.length?items.map(taskCard).join(""):emptyListState(reviewed);return '<div class="shell">'+topbar("Service Rating",false)+'<main class="scrollArea"><div class="page"><section class="intro"><div class="eyebrow">AGENT SERVICES IN THE LAST 7 DAYS</div><div class="introTitleRow"><h1>Service Rating</h1>'+languagePicker()+'</div><p class="subtext">Help us improve agent service.</p><div class="tabs"><button class="tab '+(!reviewed?"active":"")+'" onclick="showList(false)">To rate ('+pendingCount+')</button><button class="tab '+(reviewed?"active":"")+'" onclick="showList(true)">Rated ('+reviewedCount+')</button></div></section><div class="listHead"><strong>'+(!reviewed?"Rate your experience":"Recent rating")+'</strong></div><section class="taskList">'+list+'</section><p class="policy">You can rate completed agent services within 7 days of completion.</p></div></main></div>'}
function sentimentCards(sentiment,locked){return '<div class="sentiments">'+["negative","positive"].map(function(key){const selected=sentiment===key;const icon=sentimentAssets[key].unselected;return '<button class="sentiment '+key+" "+(selected?"selected":"")+'" '+(locked?"disabled":"")+' onclick="selectSentiment(\''+key+'\')"><div class="face"><img src="'+icon+'" alt=""></div><strong>'+labels[key]+'</strong></button>'}).join("")+"</div>"}
function tagGroupMarkup(groups,sentiment){if(!sentiment)return '<p class="sectionHelp">Select satisfaction to reveal tags.</p>';return '<div class="tagGroups">'+[{title:"Service attitude",tags:groups.attitude},{title:"Response time",tags:groups.responseTime}].map(function(group){return '<div class="tagGroup"><div class="tagGroupTitle">'+group.title+'</div><div class="tagGrid">'+group.tags.map(function(tag){return '<button class="tag '+(selectedTags.includes(tag)?"selected":"")+'" onclick="toggleTag(\''+escapeHtml(tag)+'\')">'+(selectedTags.includes(tag)?"✓ ":"")+escapeHtml(tag)+"</button>"}).join("")+'</div></div>'}).join("")+"</div>"}
function formPage(){const task=activeTask();const adding=task.status==="reviewed";const sentiment=adding?task.sentiment:selectedSentiment;const groups=tagSets[sentiment];const actionLabel=adding?"Save details":"Submit Rating";const anonymousControl=adding?"":'<button class="anonymousControl" type="button" role="switch" aria-checked="'+(anonymous?"true":"false")+'" onclick="toggleAnonymous()"><span class="anonymousCopy"><strong>Submit anonymously</strong><span>Agents cannot see your identity while this is on.</span></span><span class="anonymousSwitch '+(anonymous?"on":"")+'" aria-hidden="true"></span></button>';const anonymousFooter=adding?"":'<p class="anonymousFooter">'+(anonymous?"Your identity will not be shared with the agent.":"Your identity will be shared with the agent.")+'</p>';return '<div class="shell">'+topbar(adding?"Add details":"Rate service",true)+'<main class="scrollArea"><div class="detailPage"><div class="agentBlock"><div class="avatar">'+task.avatar+'</div><div><div class="agentName">'+escapeHtml(task.agent)+'</div><div class="agentDetail">'+escapeHtml(task.date)+'</div></div></div><section class="section"><div class="sectionTitle">Service included</div><p class="sectionHelp">This completed service is attached to the feedback task.</p>'+services(task,false)+'</section><section class="formIntro"><h1>How was your experience?</h1><p class="subtext">'+(adding?"Your satisfaction rating is saved. Add optional context below.":"Choose one option, then add details only if they help.")+'</p></section>'+anonymousControl+sentimentCards(sentiment,adding)+'<section class="section"><div class="sectionTitle">Feedback tags <span class="sectionHelp">(Optional)</span></div><p class="sectionHelp">Choose any tags that describe the service.</p>'+tagGroupMarkup(groups,sentiment)+'</section><section class="section"><label class="sectionTitle" for="comment">Tell us more <span class="sectionHelp">(Optional)</span></label><textarea id="comment" class="textarea" maxlength="200" placeholder="Share details about your experience..." oninput="comment=this.value;updateCounter()">'+escapeHtml(comment)+'</textarea><div class="counter" id="counter">'+comment.length+'/200</div></section></div></main><footer class="footerActions">'+anonymousFooter+'<div class="footerActionButtons"><button class="secondary" onclick="goList()">Cancel</button><button class="primary" '+(!adding&&!sentiment?"disabled":"")+' onclick="'+(adding?"saveDetails()":"submitReview()")+'">'+actionLabel+'</button></div></footer></div>'}
function reviewPage(){const task=activeTask();const sentiment=task.sentiment||"positive";const face='<img src="'+sentimentAssets[sentiment].unselected+'" alt="">';const anonymityLabel=task.anonymous===false?"Submitted with identity":"Submitted anonymously";return '<div class="shell">'+topbar("Review details",true)+'<main class="scrollArea"><div class="detailPage"><div class="agentBlock"><div class="avatar">'+task.avatar+'</div><div><div class="agentName">'+escapeHtml(task.agent)+'</div><div class="agentDetail">'+escapeHtml(task.date)+'<br>Completed service</div></div></div><section class="reviewBlock"><strong>Service included</strong><div style="margin-top:9px">'+services(task,true)+'</div></section><section class="formIntro"><h1>Your review</h1><p class="subtext">Feedback submitted for this agent service.</p></section><div class="reviewSummary"><div class="reviewResult"><div class="reviewFace">'+face+'</div><div><strong>'+labels[sentiment]+'</strong><span>Satisfaction rating submitted<br><b class="anonymousReview">'+anonymityLabel+'</b></span></div></div></div><section class="reviewBlock"><strong>Feedback tags</strong><div class="tagGrid" style="margin-top:9px">'+(task.tags&&task.tags.length?task.tags.map(function(tag){return '<span class="tag selected" style="display:inline-grid;place-items:center">✓ '+escapeHtml(tag)+"</span>"}).join(""):'<span class="sectionHelp">No additional tags submitted.</span>')+'</div></section><section class="reviewBlock"><strong>Your comment</strong><div class="commentBox">'+(task.comment?escapeHtml(task.comment):"No written comment submitted.")+'</div></section></div></main><footer class="footerActions"><div class="footerActionButtons"><button class="secondary" onclick="goList()">Back</button>'+((task.detailStatus!=="added")?'<button class="primary" onclick="openRating(\''+task.id+'\')">Add details</button>':'<button class="primary" onclick="goList()">Done</button>')+'</div></footer></div>'}
function render(){const root=document.getElementById("app");const markup=view==="form"?formPage():view==="review"?reviewPage():listPage(view==="reviewed");root.innerHTML=translateText(markup);if(document.documentElement){document.documentElement.lang=language==="PH"?"fil":"en"}if("title" in document){document.title=language==="PH"?"Rating ng Serbisyo · Portrait Prototype":"Service Rating · Portrait Prototype"}}
function renderPreservingScroll(){const scrollArea=document.querySelector(".scrollArea");const scrollTop=scrollArea?scrollArea.scrollTop:0;render();const updatedScrollArea=document.querySelector(".scrollArea");if(updatedScrollArea){updatedScrollArea.scrollTop=scrollTop;requestAnimationFrame(function(){updatedScrollArea.scrollTop=scrollTop})}}
function showList(reviewed){view=reviewed?"reviewed":"pending";render()}
function setLanguage(value){if(value!=="EN"&&value!=="PH")return;language=value;render()}
function goList(){view=activeTask().status==="reviewed"?"reviewed":"pending";selectedSentiment="";selectedTags=[];comment="";anonymous=true;render()}
function openRating(id){activeId=id;const task=activeTask();selectedSentiment=task.status==="reviewed"?(task.sentiment||""):"";selectedTags=task.tags?[].concat(task.tags):[];comment=task.comment||"";anonymous=task.status==="reviewed"?(task.anonymous!==false):true;view="form";render()}
function toggleAnonymous(){if(activeTask().status==="reviewed")return;anonymous=!anonymous;renderPreservingScroll()}
function openReview(id){activeId=id;view="review";render()}
function selectSentiment(value){if(activeTask().status==="reviewed")return;selectedSentiment=value;selectedTags=[];renderPreservingScroll()}
function toggleTag(tag){if(selectedTags.includes(tag)){selectedTags=selectedTags.filter(function(item){return item!==tag})}else{selectedTags=selectedTags.concat(tag)}renderPreservingScroll()}
function updateCounter(){const counter=document.getElementById("counter");if(counter){counter.textContent=comment.length+"/200"}}
function submitReview(){if(!selectedSentiment)return;const task=activeTask();task.status="reviewed";task.sentiment=selectedSentiment;task.tags=[].concat(selectedTags);task.comment=comment;task.anonymous=anonymous;task.detailStatus=(task.tags.length||task.comment)?"added":"not_added";view="reviewed";selectedSentiment="";selectedTags=[];comment="";anonymous=true;render();toast("Rating submitted.")}
function saveDetails(){const task=activeTask();task.tags=[].concat(selectedTags);task.comment=comment;task.detailStatus="added";view="reviewed";selectedTags=[];comment="";render();toast("Feedback details saved.")}
function closeH5(){toast("Return to game requested.")}
render();
</script>
</body>
</html>
